        <header class="top-bar">
            <div class="page-info">
                <h1>Sınav Takvimi</h1>
                <p>Yeni sınavlar tanımlayın ve mevcut sınavları organize edin.</p>
            </div>
        </header>

        <section class="data-section" style="margin-bottom: 30px;">
            <div class="section-header">
                <h2><i class="fas fa-plus-circle"></i> Sınav Oluştur</h2>
            </div>
            <form id="sinavForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <input type="text" id="sinav_adi" placeholder="Sınav Adı (Örn: TYT Deneme-1)" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; color: white;">

                <select id="ders_id" class="atomus-select" required style="background: #1e293b; border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; color: white;">
                    <option value="">Ders Seçiniz</option>
                </select>

                <input type="date" id="sinav_tarihi" required style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; color: white;">
                
                <button type="submit" id="submitBtn" class="btn-main" style="border: none; cursor: pointer; padding: 12px; border-radius: 12px; background: var(--accent-blue); color: var(--bg-dark); font-weight: 600;">
                    Sınavı Kaydet
                </button>
            </form>
        </section>

        <section class="data-section">
            <div class="section-header">
                <h2><i class="fas fa-calendar-alt"></i> Planlanan Sınavlar</h2>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Sınav ID</th>
                            <th>Sınav Adı</th>
                            <th>Ders</th>
                            <th>Tarih</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="sinavTablo">
                        </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const icon = document.getElementById('toggle-icon');
        
        if (window.innerWidth <= 992) {
            sidebar.classList.toggle('active');
        } else {
            sidebar.classList.toggle('collapsed');
            if(sidebar.classList.contains('collapsed')) {
                icon.classList.replace('fa-chevron-left', 'fa-chevron-right');
            } else {
                icon.classList.replace('fa-chevron-right', 'fa-chevron-left');
            }
        }
    }
</script>
